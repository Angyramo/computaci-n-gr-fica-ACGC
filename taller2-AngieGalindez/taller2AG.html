<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página con CSS Externo</title>
    <link rel="stylesheet" href="mystyle.css">
</head>
<body>
    <div class="header">
        <div id="logo">
            Logo
        </div>
        <div class="buscador">
            <input type="text" placeholder="Buscador">
        </div>
    </div>

    <div id="contenedor">
        <div class="side-bar">
            Side-bar
        </div>
        <div class="content">
            content
        </div>

        <div class="footer">
            <div class="footer-main">Footer</div>
            <div class="footer-1">Footer-1</div>
            <div class="footer-2">Footer-2</div>
            <div class="footer-3">Footer-3</div>
        </div>
    </div>
</body>
</html>
